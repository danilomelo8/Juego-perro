<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐕 Perro Aventurero vs Pulgas y Garrapatas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
        }
        #gameWrapper {
            background: linear-gradient(145deg, #1a1a3e, #0d0d2b);
            padding: 20px;
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(233, 69, 96, 0.2);
            border: 2px solid rgba(233, 69, 96, 0.3);
            position: relative;
        }
        #gameContainer {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            max-width: 900px;
            height: auto;
            background: #87CEEB;
            cursor: pointer;
            image-rendering: pixelated;
        }
        #ui {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 15px 15px 0 0;
            border-bottom: 2px solid rgba(233, 69, 96, 0.3);
            flex-wrap: wrap;
            gap: 10px;
        }
        #ui .stats {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        #ui .stat-item {
            background: rgba(0, 0, 0, 0.4);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #ui .stat-item .icon {
            font-size: 20px;
        }
        #ui .stat-item .value {
            color: #ffd700;
            font-size: 18px;
            min-width: 20px;
        }
        #levelBadge {
            background: linear-gradient(135deg, #ff6b35, #e94560);
            padding: 6px 18px;
            border-radius: 20px;
            font-weight: bold;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
        }
        #controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border-radius: 0 0 15px 15px;
            border-top: 2px solid rgba(233, 69, 96, 0.3);
            flex-wrap: wrap;
            gap: 10px;
        }
        #controls .keys {
            color: #aaa;
            font-size: 13px;
        }
        #controls kbd {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 3px 10px;
            border-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin: 0 3px;
            font-size: 12px;
        }
        button {
            background: linear-gradient(135deg, #e94560, #c23152);
            border: none;
            color: white;
            padding: 8px 20px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.3);
        }
        button:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 25px rgba(233, 69, 96, 0.5);
        }
        button:active {
            transform: scale(0.95);
        }
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(15px);
            color: white;
            padding: 40px 50px;
            border-radius: 25px;
            text-align: center;
            font-size: 24px;
            border: 3px solid #e94560;
            display: none;
            z-index: 20;
            min-width: 350px;
            max-width: 90%;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9);
        }
        #message h2 {
            font-size: 36px;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #ffd700, #ff6b35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #message p {
            font-size: 18px;
            margin: 10px 0;
            color: #ddd;
            -webkit-text-fill-color: #ddd;
        }
        #message button {
            margin-top: 20px;
            font-size: 18px;
            padding: 12px 40px;
        }
        #mobileControls {
            display: none;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        #mobileControls button {
            padding: 12px 20px;
            font-size: 20px;
            min-width: 60px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        #mobileControls button:active {
            background: rgba(255, 255, 255, 0.3);
        }
        @media (max-width: 768px) {
            #gameWrapper {
                padding: 10px;
                border-radius: 15px;
            }
            #ui {
                font-size: 13px;
                padding: 8px 12px;
            }
            #ui .stat-item {
                padding: 4px 10px;
            }
            #controls .keys {
                font-size: 11px;
            }
            #message {
                padding: 25px 30px;
                font-size: 18px;
                min-width: 280px;
            }
            #message h2 {
                font-size: 28px;
            }
            #mobileControls {
                display: flex;
            }
            canvas {
                touch-action: none;
            }
        }
        @media (max-width: 480px) {
            #ui .stats {
                gap: 8px;
            }
            #ui .stat-item .icon {
                font-size: 16px;
            }
            #controls .keys {
                display: none;
            }
        }
    </style>
</head>
<body>

<div id="gameWrapper">
    <div id="gameContainer">
        <div id="ui">
            <div class="stats">
                <div class="stat-item">
                    <span class="icon">❤️</span>
                    <span class="value" id="lives">3</span>
                </div>
                <div class="stat-item">
                    <span class="icon">⭐</span>
                    <span class="value" id="score">0</span>
                </div>
            </div>
            <div id="levelBadge">
                🏆 Nivel <span id="level">1</span>/3
            </div>
            <button id="resetBtn">🔄 Reiniciar</button>
        </div>
        
        <div style="position: relative;">
            <canvas id="gameCanvas" width="900" height="500"></canvas>
            <div id="message">
                <h2 id="msgTitle">🎉 ¡Victoria!</h2>
                <p id="msgBody"></p>
                <button id="msgBtn">Continuar</button>
            </div>
        </div>
        
        <div id="controls">
            <div class="keys">
                <kbd>←</kbd> <kbd>→</kbd> Mover &nbsp;|&nbsp; <kbd>Espacio</kbd> Saltar &nbsp;|&nbsp; <kbd>Z</kbd> Atacar
            </div>
            <div style="color: #666; font-size: 12px;">
                🐕 ¡Salva a tu dueño!
            </div>
        </div>
        
        <div id="mobileControls">
            <button id="btnLeft">◀</button>
            <button id="btnRight">▶</button>
            <button id="btnJump">⬆</button>
            <button id="btnAttack">⚡</button>
        </div>
    </div>
</div>

<script>
    // ==================== CONFIGURACIÓN INICIAL ====================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const livesSpan = document.getElementById('lives');
    const scoreSpan = document.getElementById('score');
    const levelSpan = document.getElementById('level');
    const messageDiv = document.getElementById('message');
    const msgTitle = document.getElementById('msgTitle');
    const msgBody = document.getElementById('msgBody');
    const msgBtn = document.getElementById('msgBtn');
    const resetBtn = document.getElementById('resetBtn');

    // ==================== CONSTANTES ====================
    const GRAVITY = 0.55;
    const FRICTION = 0.88;
    const MAX_SPEED = 5.5;
    const CANVAS_W = 900;
    const CANVAS_H = 500;
    const GROUND_Y = CANVAS_H - 50;

    // ==================== ESTADO DEL JUEGO ====================
    let gameState = {
        lives: 3,
        score: 0,
        level: 1,
        maxLevel: 3,
        gameOver: false,
        won: false,
        paused: false,
        showingMessage: false,
        finalScene: false
    };

    // ==================== CLASES ====================
    class Perro {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.width = 42;
            this.height = 48;
            this.vx = 0;
            this.vy = 0;
            this.onGround = false;
            this.facing = 1;
            this.attacking = false;
            this.attackTimer = 0;
            this.animFrame = 0;
            this.animTimer = 0;
            this.walkCycle = 0;
            this.invincible = 0;
        }

        update(keys) {
            // Movimiento
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                this.vx -= 0.7;
                this.facing = -1;
            }
            if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                this.vx += 0.7;
                this.facing = 1;
            }

            if (Math.abs(this.vx) > MAX_SPEED) {
                this.vx = MAX_SPEED * Math.sign(this.vx);
            }

            if (!keys['ArrowLeft'] && !keys['ArrowRight'] && !keys['a'] && !keys['A'] && !keys['d'] && !keys['D']) {
                this.vx *= FRICTION;
                if (Math.abs(this.vx) < 0.1) this.vx = 0;
            }

            // Salto
            if ((keys['Space'] || keys['w'] || keys['W'] || keys['ArrowUp']) && this.onGround) {
                this.vy = -11.5;
                this.onGround = false;
            }

            // Ataque
            if (keys['z'] || keys['Z']) {
                if (!this.attacking) {
                    this.attacking = true;
                    this.attackTimer = 12;
                }
            }

            // Gravedad
            this.vy += GRAVITY;
            if (this.vy > 12) this.vy = 12;

            this.x += this.vx;
            this.y += this.vy;

            // Límites
            if (this.x < 0) this.x = 0;
            if (this.x + this.width > CANVAS_W) this.x = CANVAS_W - this.width;
            
            if (this.y + this.height > GROUND_Y) {
                this.y = GROUND_Y - this.height;
                this.vy = 0;
                this.onGround = true;
            }

            // Invincibilidad
            if (this.invincible > 0) this.invincible--;

            // Animaciones
            if (this.attacking) {
                this.attackTimer--;
                if (this.attackTimer <= 0) this.attacking = false;
            }

            if (Math.abs(this.vx) > 0.5) {
                this.animTimer++;
                if (this.animTimer > 6) {
                    this.animTimer = 0;
                    this.animFrame = (this.animFrame + 1) % 4;
                    this.walkCycle = (this.walkCycle + 1) % 8;
                }
            } else {
                this.animFrame = 0;
                this.walkCycle = 0;
            }
        }

        draw(ctx) {
            if (this.invincible > 0 && Math.floor(this.invincible / 4) % 2 === 0) {
                ctx.globalAlpha = 0.5;
            }

            const x = this.x;
            const y = this.y;
            const f = this.facing;

            ctx.save();
            ctx.translate(x + this.width/2, y + this.height/2);
            if (f < 0) ctx.scale(-1, 1);
            ctx.translate(-this.width/2, -this.height/2);

            // Sombra
            ctx.shadowColor = 'rgba(0,0,0,0.25)';
            ctx.shadowBlur = 12;
            ctx.shadowOffsetY = 4;

            // Cuerpo
            const grad = ctx.createLinearGradient(0, 0, 0, this.height);
            grad.addColorStop(0, '#deb887');
            grad.addColorStop(0.5, '#c4a35a');
            grad.addColorStop(1, '#8b7355');
            ctx.fillStyle = grad;
            
            ctx.beginPath();
            ctx.ellipse(this.width/2, this.height/2 + 5, 19, 23, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Cabeza
            ctx.shadowBlur = 8;
            ctx.fillStyle = '#deb887';
            ctx.beginPath();
            ctx.ellipse(this.width/2 + 5, 5, 15, 13, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Hocico
            ctx.fillStyle = '#8b7355';
            ctx.beginPath();
            ctx.ellipse(this.width/2 + 13, 8, 8, 6, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Nariz
            ctx.shadowBlur = 4;
            ctx.fillStyle = '#1a1a2e';
            ctx.beginPath();
            ctx.arc(this.width/2 + 17, 7, 3.5, 0, Math.PI * 2);
            ctx.fill();
            
            // Ojos
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(this.width/2 + 10, 2, 4.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(this.width/2 + 2, 2, 4.5, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#1a1a2e';
            ctx.beginPath();
            ctx.arc(this.width/2 + 11, 1, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(this.width/2 + 3, 1, 2.5, 0, Math.PI * 2);
            ctx.fill();

            // Brillos en ojos
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            ctx.beginPath();
            ctx.arc(this.width/2 + 12, 0, 1, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(this.width/2 + 4, 0, 1, 0, Math.PI * 2);
            ctx.fill();

            // Orejas
            ctx.shadowBlur = 6;
            ctx.fillStyle = '#8b7355';
            ctx.beginPath();
            ctx.ellipse(this.width/2 - 3, -8, 6, 11, -0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(this.width/2 + 13, -8, 6, 11, 0.3, 0, Math.PI * 2);
            ctx.fill();

            // Boca
            ctx.strokeStyle = '#5a3d2b';
            ctx.lineWidth = 1.5;
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(this.width/2 + 13, 11, 6, 0.1, Math.PI - 0.1);
            ctx.stroke();

            // Lengua (si está cansado)
            if (this.animFrame > 2) {
                ctx.fillStyle = '#ff6b6b';
                ctx.beginPath();
                ctx.arc(this.width/2 + 13, 14, 3, 0, Math.PI);
                ctx.fill();
            }

            // Patas
            ctx.shadowBlur = 6;
            ctx.fillStyle = '#c4a35a';
            const legOffset = this.walkCycle > 3 ? 3 : -3;
            ctx.fillRect(10, this.height - 6 + legOffset, 5, 10);
            ctx.fillRect(23, this.height - 6 - legOffset, 5, 10);
            ctx.fillRect(2, this.height - 6 - legOffset, 5, 10);
            ctx.fillRect(32, this.height - 6 + legOffset, 5, 10);

            // Cola
            ctx.strokeStyle = '#8b7355';
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.shadowBlur = 6;
            ctx.beginPath();
            const tailWag = Math.sin(Date.now() / 180) * 18;
            ctx.moveTo(36, 10);
            ctx.quadraticCurveTo(52, -12 + tailWag, 46, 0 + tailWag);
            ctx.stroke();

            // Collar
            ctx.shadowBlur = 4;
            ctx.strokeStyle = '#e94560';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(this.width/2 + 2, 14, 10, 0.1, Math.PI - 0.1);
            ctx.stroke();
            
            // Placa del collar
            ctx.fillStyle = '#ffd700';
            ctx.shadowBlur = 8;
            ctx.shadowColor = 'rgba(255,215,0,0.4)';
            ctx.beginPath();
            ctx.arc(this.width/2 - 2, 16, 4, 0, Math.PI * 2);
            ctx.fill();

            // Ataque
            if (this.attacking) {
                ctx.shadowBlur = 40;
                ctx.shadowColor = 'rgba(255, 107, 53, 0.6)';
                ctx.strokeStyle = 'rgba(255, 200, 50, 0.6)';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(this.width/2 + 22 * f, 10, 25, -0.6, 0.6);
                ctx.stroke();
                
                ctx.fillStyle = 'rgba(255, 215, 0, 0.85)';
                ctx.font = 'bold 22px Arial';
                ctx.shadowBlur = 30;
                ctx.shadowColor = 'rgba(255, 215, 0, 0.5)';
                ctx.fillText('¡GUAU!', this.width/2 + 30 * f, -8);
            }

            ctx.restore();
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
        }

        getAttackBox() {
            return {
                x: this.facing === 1 ? this.x + this.width - 5 : this.x - 40,
                y: this.y - 5,
                width: 50,
                height: this.height + 10
            };
        }
    }

    class Enemigo {
        constructor(x, y, tipo, velocidad = 1) {
            this.x = x;
            this.y = y;
            this.tipo = tipo;
            this.velocidad = velocidad;
            this.direccion = 1;
            this.width = tipo === 'pulga' ? 28 : 38;
            this.height = tipo === 'pulga' ? 22 : 32;
            this.vx = velocidad * this.direccion;
            this.vy = 0;
            this.onGround = false;
            this.animTimer = 0;
            this.animFrame = 0;
            this.patrolRange = 160;
            this.startX = x;
            this.alive = true;
            this.hitTimer = 0;
            this.isBoss = false;
            this.hp = 1;
            this.maxHp = 1;
            this.jumpCooldown = 0;
        }

        update() {
            if (!this.alive) return;
            
            this.x += this.vx;
            
            if (this.x > this.startX + this.patrolRange) {
                this.direccion = -1;
                this.vx = -this.velocidad;
            } else if (this.x < this.startX - this.patrolRange) {
                this.direccion = 1;
                this.vx = this.velocidad;
            }

            if (this.tipo === 'garrapata' && this.jumpCooldown <= 0 && this.onGround && Math.random() < 0.015) {
                this.vy = -7.5 - Math.random() * 2;
                this.onGround = false;
                this.jumpCooldown = 60;
            }
            if (this.jumpCooldown > 0) this.jumpCooldown--;

            this.vy += GRAVITY;
            if (this.vy > 10) this.vy = 10;
            this.y += this.vy;

            if (this.y + this.height > GROUND_Y) {
                this.y = GROUND_Y - this.height;
                this.vy = 0;
                this.onGround = true;
            }

            this.animTimer++;
            if (this.animTimer > 8) {
                this.animTimer = 0;
                this.animFrame = (this.animFrame + 1) % 4;
            }

            if (this.hitTimer > 0) this.hitTimer--;
        }

        draw(ctx) {
            if (!this.alive) return;
            
            const x = this.x;
            const y = this.y;
            
            ctx.save();
            ctx.shadowColor = 'rgba(0,0,0,0.2)';
            ctx.shadowBlur = 8;
            ctx.shadowOffsetY = 3;

            if (this.tipo === 'pulga') {
                // PULGA
                const grad = ctx.createRadialGradient(x+12, y+8, 2, x+14, y+10, 16);
                grad.addColorStop(0, '#6d4c41');
                grad.addColorStop(1, '#2d1b0e');
                ctx.fillStyle = grad;
                
                ctx.beginPath();
                ctx.ellipse(x+14, y+10, 14, 10, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // Ojos rojos
                ctx.shadowBlur = 8;
                ctx.shadowColor = 'rgba(255,0,0,0.5)';
                ctx.fillStyle = '#ff1744';
                ctx.beginPath();
                ctx.arc(x+8, y+6, 3.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x+20, y+6, 3.5, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'black';
                ctx.beginPath();
                ctx.arc(x+9, y+6, 1.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x+21, y+6, 1.5, 0, Math.PI * 2);
                ctx.fill();
                
                // Patas
                ctx.strokeStyle = '#2d1b0e';
                ctx.lineWidth = 2;
                ctx.shadowBlur = 0;
                for (let i = 0; i < 6; i++) {
                    const angle = (i / 6) * Math.PI * 2 + this.animFrame * 0.3;
                    const legX = x + 12 + Math.cos(angle) * 12;
                    const legY = y + 10 + Math.sin(angle) * 8;
                    ctx.beginPath();
                    ctx.moveTo(x + 4 + i * 4, y + 16);
                    ctx.lineTo(legX, legY);
                    ctx.stroke();
                }
                
                // Antenas
                ctx.strokeStyle = '#2d1b0e';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(x+8, y+4);
                ctx.lineTo(x+3, y-4);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x+20, y+4);
                ctx.lineTo(x+25, y-4);
                ctx.stroke();
                
            } else {
                // GARRAPATA
                const grad = ctx.createRadialGradient(x+19, y+13, 3, x+19, y+16, 22);
                grad.addColorStop(0, '#c62828');
                grad.addColorStop(0.6, '#8e0000');
                grad.addColorStop(1, '#4a0000');
                ctx.fillStyle = grad;
                
                ctx.shadowBlur = 15;
                ctx.shadowColor = 'rgba(139,26,26,0.4)';
                ctx.beginPath();
                ctx.arc(x+19, y+16, 20, 0, Math.PI * 2);
                ctx.fill();
                
                // Ojos amarillos
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'rgba(255,200,0,0.6)';
                ctx.fillStyle = '#ffd700';
                ctx.beginPath();
                ctx.arc(x+13, y+10, 4.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x+25, y+10, 4.5, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#1a0000';
                ctx.fillRect(x+12, y+8, 2, 5.5);
                ctx.fillRect(x+24, y+8, 2, 5.5);
                
                // Caparazón
                ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(x+19, y+16, 10, 0, Math.PI * 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x+19, y+4);
                ctx.lineTo(x+19, y+28);
                ctx.stroke();
                
                // 8 patas
                ctx.strokeStyle = '#4a0000';
                ctx.lineWidth = 2.5;
                ctx.shadowBlur = 4;
                for (let i = 0; i < 8; i++) {
                    const angle = (i / 8) * Math.PI * 2 + this.animFrame * 0.2;
                    const legX = x + 19 + Math.cos(angle) * 20;
                    const legY = y + 16 + Math.sin(angle) * 15;
                    ctx.beginPath();
                    ctx.moveTo(x + 11 + i * 2, y + 27);
                    ctx.lineTo(legX, legY);
                    ctx.stroke();
                }
                
                // Colmillos
                ctx.fillStyle = '#666';
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.moveTo(x+15, y+30);
                ctx.lineTo(x+19, y+37);
                ctx.lineTo(x+23, y+30);
                ctx.fill();
                
                // Veneno
                if (this.hitTimer > 0) {
                    ctx.fillStyle = 'rgba(0,255,0,0.25)';
                    ctx.shadowBlur = 25;
                    ctx.shadowColor = 'rgba(0,255,0,0.4)';
                    for (let i = 0; i < 3; i++) {
                        ctx.beginPath();
                        ctx.arc(x + 8 + i * 11, y + 38 + i * 3, 4, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                // Si es boss, mostrar corona
                if (this.isBoss) {
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = 'rgba(255,215,0,0.5)';
                    ctx.font = '30px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('👑', x + 19, y - 8);
                }
            }
            
            ctx.restore();
            ctx.shadowBlur = 0;
        }

        getBox() {
            return {
                x: this.x + 2,
                y: this.y + 2,
                width: this.width - 4,
                height: this.height - 4
            };
        }
    }

    class Item {
        constructor(x, y, tipo) {
            this.x = x;
            this.y = y;
            this.tipo = tipo;
            this.width = 24;
            this.height = 24;
            this.alive = true;
            this.animTimer = 0;
            this.vy = -2;
            this.gravity = 0.1;
        }

        update() {
            if (!this.alive) return;
            this.animTimer++;
            this.vy += this.gravity;
            this.y += this.vy;
            
            if (this.y + this.height > GROUND_Y) {
                this.y = GROUND_Y - this.height;
                this.vy = 0;
            }
        }

        draw(ctx) {
            if (!this.alive) return;
            
            ctx.save();
            const pulse = Math.sin(this.animTimer / 8) * 3;
            const glow = Math.sin(this.animTimer / 12) * 0.3 + 0.7;
            
            ctx.shadowBlur = 20;
            
            if (this.tipo === 'hueso') {
                ctx.shadowColor = `rgba(255,215,0,${glow * 0.3})`;
                ctx.fillStyle = '#f5e6d3';
                ctx.strokeStyle = '#d4b896';
                ctx.lineWidth = 2;
                
                ctx.beginPath();
                ctx.ellipse(this.x+6, this.y+10+pulse, 5, 7, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.beginPath();
                ctx.ellipse(this.x+18, this.y+10+pulse, 5, 7, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.fillRect(this.x+4, this.y+5+pulse, 16, 10);
                ctx.strokeRect(this.x+4, this.y+5+pulse, 16, 10);
                
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.beginPath();
                ctx.arc(this.x+9, this.y+7+pulse, 3, 0, Math.PI * 2);
                ctx.fill();
                
            } else {
                ctx.shadowColor = `rgba(255,0,0,${glow * 0.5})`;
                ctx.fillStyle = '#ff1744';
                ctx.beginPath();
                ctx.moveTo(this.x+12, this.y+5+pulse);
                ctx.bezierCurveTo(this.x+12, this.y-3+pulse, this.x+2, this.y-3+pulse, this.x+2, this.y+5+pulse);
                ctx.bezierCurveTo(this.x+2, this.y+14+pulse, this.x+12, this.y+22+pulse, this.x+12, this.y+22+pulse);
                ctx.bezierCurveTo(this.x+12, this.y+22+pulse, this.x+22, this.y+14+pulse, this.x+22, this.y+5+pulse);
                ctx.bezierCurveTo(this.x+22, this.y-3+pulse, this.x+12, this.y-3+pulse, this.x+12, this.y+5+pulse);
                ctx.fill();
                
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.beginPath();
                ctx.arc(this.x+8, this.y+7+pulse, 3, 0, Math.PI * 2);
                ctx.fill();
                
                // Brillo pulsante
                ctx.shadowBlur = 30;
                ctx.shadowColor = `rgba(255,0,0,${glow * 0.2})`;
            }
            
            ctx.restore();
            ctx.shadowBlur = 0;
        }

        getBox() {
            return {
                x: this.x + 2,
                y: this.y + 2,
                width: this.width - 4,
                height: this.height - 4
            };
        }
    }

    // ==================== VARIABLES GLOBALES ====================
    let perro;
    let enemigos = [];
    let items = [];
    let keys = {};
    let particles = [];
    let frameCount = 0;
    let bossDefeated = false;
    let finalSceneTimer = 0;
    let platforms = [];

    // ==================== FUNCIONES DE INICIALIZACIÓN ====================
    function initLevel(level) {
        perro = new Perro(50, GROUND_Y - 80);
        enemigos = [];
        items = [];
        particles = [];
        bossDefeated = false;
        finalSceneTimer = 0;
        gameState.finalScene = false;
        
        messageDiv.style.display = 'none';
        gameState.showingMessage = false;
        
        const numEnemies = 3 + level * 2;
        
        if (level === 1) {
            for (let i = 0; i < numEnemies; i++) {
                const x = 140 + i * 120 + Math.random() * 40;
                enemigos.push(new Enemigo(x, GROUND_Y - 30, 'pulga', 0.8 + Math.random() * 0.5));
            }
            for (let i = 0; i < 3; i++) {
                items.push(new Item(180 + i * 200, 100, 'hueso'));
            }
            items.push(new Item(750, 80, 'corazon'));
            
        } else if (level === 2) {
            for (let i = 0; i < numEnemies - 1; i++) {
                const x = 100 + i * 140 + Math.random() * 50;
                enemigos.push(new Enemigo(x, GROUND_Y - 30, 'garrapata', 0.6 + Math.random() * 0.4));
            }
            for (let i = 0; i < 4; i++) {
                items.push(new Item(130 + i * 160, 90 + i * 15, 'hueso'));
            }
            items.push(new Item(700, 60, 'corazon'));
            
        } else if (level === 3) {
            for (let i = 0; i < 4; i++) {
                const x = 70 + i * 150 + Math.random() * 40;
                enemigos.push(new Enemigo(x, GROUND_Y - 30, 'pulga', 0.9 + Math.random() * 0.4));
            }
            for (let i = 0; i < 4; i++) {
                const x = 90 + i * 160 + Math.random() * 50;
                enemigos.push(new Enemigo(x, GROUND_Y - 30, 'garrapata', 0.7 + Math.random() * 0.3));
            }
            for (let i = 0; i < 5; i++) {
                items.push(new Item(90 + i * 150, 70 + i * 18, 'hueso'));
            }
            items.push(new Item(760, 50, 'corazon'));
            
            // BOSS
            const boss = new Enemigo(780, GROUND_Y - 50, 'garrapata', 1.4);
            boss.width = 75;
            boss.height = 65;
            boss.patrolRange = 60;
            boss.startX = 780;
            boss.velocidad = 1.6;
            boss.isBoss = true;
            boss.hp = 6;
            boss.maxHp = 6;
            enemigos.push(boss);
        }

        // Plataformas
        platforms = [];
        for (let i = 0; i < 6; i++) {
            platforms.push({
                x: 60 + i * 160,
                y: GROUND_Y - 70 - Math.sin(i * 0.7) * 30,
                width: 75,
                height: 14
            });
        }
        platforms.push({ x: 380, y: GROUND_Y - 140, width: 100, height: 14 });
        platforms.push({ x: 580, y: GROUND_Y - 180, width: 90, height: 14 });
        platforms.push({ x: 750, y: GROUND_Y - 120, width: 80, height: 14 });
    }

    // ==================== COLISIONES ====================
    function rectCollide(r1, r2) {
        return r1.x < r2.x + r2.width &&
               r1.x + r1.width > r2.x &&
               r1.y < r2.y + r2.height &&
               r1.y + r1.height > r2.y;
    }

    function checkCollisions() {
        perro.onGround = false;
        for (const plat of platforms) {
            if (perro.vy >= 0 &&
                perro.x + perro.width - 5 > plat.x &&
                perro.x + 5 < plat.x + plat.width &&
                perro.y + perro.height > plat.y &&
                perro.y + perro.height < plat.y + plat.height + 12) {
                perro.y = plat.y - perro.height;
                perro.vy = 0;
                perro.onGround = true;
            }
        }

        for (const enemy of enemigos) {
            if (!enemy.alive) continue;
            
            const enemyBox = enemy.getBox();
            const perroBox = {
                x: perro.x + 6,
                y: perro.y + 6,
                width: perro.width - 12,
                height: perro.height - 12
            };
            
            if (rectCollide(perroBox, enemyBox) && perro.invincible === 0) {
                if (perro.attacking) {
                    if (enemy.isBoss) {
                        enemy.hp--;
                        enemy.hitTimer = 10;
                        spawnParticles(enemy.x + enemy.width/2, enemy.y + enemy.height/2, '#ff6b35', 20);
                        if (enemy.hp <= 0) {
                            enemy.alive = false;
                            bossDefeated = true;
                            gameState.score += 100;
                            spawnParticles(enemy.x + enemy.width/2, enemy.y + enemy.height/2, '#ffd700', 40);
                            updateUI();
                        }
                    } else {
                        enemy.alive = false;
                        gameState.score += 10;
                        spawnParticles(enemy.x + enemy.width/2, enemy.y + enemy.height/2, '#ff6b35', 15);
                        updateUI();
                    }
                } else {
                    gameState.lives--;
                    perro.invincible = 60;
                    spawnParticles(perro.x + perro.width/2, perro.y + perro.height/2, '#ff1744', 25);
                    updateUI();
                    
                    if (gameState.lives <= 0) {
                        gameOver('💀 Game Over', '¡El perro ha sido derrotado!');
                    }
                }
            }
        }

        for (const item of items) {
            if (!item.alive) continue;
            const itemBox = item.getBox();
            const perroBox = {
                x: perro.x + 6,
                y: perro.y + 6,
                width: perro.width - 12,
                height: perro.height - 12
            };
            
            if (rectCollide(perroBox, itemBox)) {
                item.alive = false;
                if (item.tipo === 'hueso') {
                    gameState.score += 5;
                    spawnParticles(item.x + item.width/2, item.y + item.height/2, '#ffd700', 12);
                } else if (item.tipo === 'corazon') {
                    gameState.lives = Math.min(gameState.lives + 1, 5);
                    spawnParticles(item.x + item.width/2, item.y + item.height/2, '#ff1744', 20);
                }
                updateUI();
            }
        }

        let allDead = true;
        for (const enemy of enemigos) {
            if (enemy.alive) {
                allDead = false;
                break;
            }
        }

        if (allDead && !gameState.gameOver && !gameState.showingMessage) {
            if (gameState.level === gameState.maxLevel && bossDefeated) {
                gameState.finalScene = true;
                gameState.paused = true;
                setTimeout(() => {
                    showMessage('🏆 ¡Misión Cumplida!', '🐕 El perro rescató a su dueño de la garrapata gigante.\n¡Eres un héroe!', '🔄 Jugar de nuevo');
                    msgBtn.onclick = resetGame;
                }, 1500);
            } else if (gameState.level < gameState.maxLevel) {
                showMessage('🎉 ¡Nivel Completado!', `Puntaje: ${gameState.score}`, '⬆ Siguiente Nivel');
                msgBtn.onclick = () => {
                    gameState.level++;
                    updateUI();
                    initLevel(gameState.level);
                    messageDiv.style.display = 'none';
                    gameState.showingMessage = false;
                    gameState.paused = false;
                };
            }
        }
    }

    function spawnParticles(x, y, color, count) {
        for (let i = 0; i < count; i++) {
            particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 8,
                vy: (Math.random() - 0.5) * 8 - 3,
                life: 30 + Math.random() * 30,
                color: color,
                size: 2 + Math.random() * 6
            });
        }
    }

    // ==================== FUNCIONES UI ====================
    function updateUI() {
        livesSpan.textContent = gameState.lives;
        scoreSpan.textContent = gameState.score;
        levelSpan.textContent = gameState.level;
    }

    function showMessage(title, body, btnText) {
        messageDiv.style.display = 'block';
        msgTitle.textContent = title;
        msgBody.textContent = body;
        msgBtn.textContent = btnText || 'Continuar';
        gameState.showingMessage = true;
        gameState.paused = true;
    }

    function gameOver(title, body) {
        gameState.gameOver = true;
        showMessage(title, body, '🔄 Reintentar');
        msgBtn.onclick = resetGame;
    }

    function resetGame() {
        gameState.lives = 3;
        gameState.score = 0;
        gameState.level = 1;
        gameState.gameOver = false;
        gameState.showingMessage = false;
        gameState.paused = false;
        gameState.finalScene = false;
        messageDiv.style.display = 'none';
        bossDefeated = false;
        updateUI();
        initLevel(gameState.level);
    }

    // ==================== DIBUJADO ====================
    function drawBackground() {
        const skyGrad = ctx.createLinearGradient(0, 0, 0, CANVAS_H);
        skyGrad.addColorStop(0, '#0d1b2a');
        skyGrad.addColorStop(0.2, '#1b3a4b');
        skyGrad.addColorStop(0.5, '#4a90a8');
        skyGrad.addColorStop(0.8, '#87CEEB');
        skyGrad.addColorStop(1, '#b5dffa');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
        
        // Sol
        const sunX = CANVAS_W - 80;
        const sunY = 60;
        const sunGrad = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 80);
        sunGrad.addColorStop(0, 'rgba(255,235,59,1)');
        sunGrad.addColorStop(0.3, 'rgba(255,235,59,0.8)');
        sunGrad.addColorStop(1, 'rgba(255,235,59,0)');
        ctx.fillStyle = sunGrad;
        ctx.beginPath();
        ctx.arc(sunX, sunY, 80, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = '#fff9c4';
        ctx.shadowBlur = 40;
        ctx.shadowColor = 'rgba(255,235,59,0.4)';
        ctx.beginPath();
        ctx.arc(sunX, sunY, 35, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        
        // Nubes
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        const cloudOffset = frameCount * 0.015 % CANVAS_W;
        for (let i = 0; i < 6; i++) {
            const cx = (i * 180 + cloudOffset) % CANVAS_W;
            const cy = 25 + i * 20 % 50;
            ctx.beginPath();
            ctx.arc(cx, cy, 28, 0, Math.PI * 2);
            ctx.arc(cx + 35, cy - 8, 32, 0, Math.PI * 2);
            ctx.arc(cx + 70, cy, 28, 0, Math.PI * 2);
            ctx.fill();
        }
        
        // Montañas
        ctx.fillStyle = '#1a3a2a';
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y);
        for (let x = 0; x <= CANVAS_W; x += 15) {
            const y = GROUND_Y - Math.sin(x * 0.007 + 0.5) * 45 - Math.sin(x * 0.012 + 2) * 25 - 20;
            ctx.lineTo(x, y);
        }
        ctx.lineTo(CANVAS_W, GROUND_Y);
        ctx.fill();
        
        ctx.fillStyle = '#2a5a3a';
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y);
        for (let x = 0; x <= CANVAS_W; x += 15) {
            const y = GROUND_Y - Math.sin(x * 0.005 + 1.5) * 30 - Math.sin(x * 0.009 + 0.5) * 20 - 10;
            ctx.lineTo(x, y);
        }
        ctx.lineTo(CANVAS_W, GROUND_Y);
        ctx.fill();
        
        // Césped
        ctx.fillStyle = '#4caf50';
        ctx.fillRect(0, GROUND_Y, CANVAS_W, 50);
        ctx.fillStyle = '#388e3c';
        for (let x = 0; x < CANVAS_W; x += 6) {
            const h = 4 + Math.sin(x * 0.4 + frameCount * 0.02) * 2;
            ctx.fillRect(x, GROUND_Y - h, 2, h);
        }
        
        // Camino
        ctx.fillStyle = 'rgba(139, 115, 85, 0.3)';
        ctx.fillRect(0, GROUND_Y + 2, CANVAS_W, 8);
    }

    function drawPlatforms() {
        for (const plat of platforms) {
            const grad = ctx.createLinearGradient(plat.x, plat.y, plat.x, plat.y + plat.height);
            grad.addColorStop(0, '#a1887f');
            grad.addColorStop(0.5, '#795548');
            grad.addColorStop(1, '#4e342e');
            ctx.fillStyle = grad;
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = 10;
            ctx.shadowOffsetY = 3;
            
            ctx.beginPath();
            ctx.roundRect(plat.x, plat.y, plat.width, plat.height, 6);
            ctx.fill();
            
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255,255,255,0.15)';
            ctx.fillRect(plat.x + 6, plat.y, plat.width - 12, 3);
            
            // Detalles de pasto en la plataforma
            ctx.fillStyle = '#66bb6a';
            for (let x = plat.x + 5; x < plat.x + plat.width - 5; x += 12) {
                ctx.fillRect(x, plat.y - 3, 2, 4);
            }
        }
    }

    function drawParticles() {
        for (const p of particles) {
            ctx.globalAlpha = Math.min(1, p.life / 25);
            ctx.fillStyle = p.color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * (0.3 + 0.7 * p.life / 50), 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
    }

    function updateParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.1;
            p.vx *= 0.98;
            p.life--;
            if (p.life <= 0) particles.splice(i, 1);
        }
    }

    function drawBossHP() {
        for (const enemy of enemigos) {
            if (enemy.isBoss && enemy.alive) {
                const barWidth = 120;
                const barHeight = 14;
                const x = enemy.x + enemy.width/2 - barWidth/2;
                const y = enemy.y - 30;
                
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.beginPath();
                ctx.roundRect(x - 3, y - 3, barWidth + 6, barHeight + 6, 4);
                ctx.fill();
                
                ctx.fillStyle = '#2a2a2a';
                ctx.beginPath();
                ctx.roundRect(x, y, barWidth, barHeight, 3);
                ctx.fill();
                
                const hpPercent = enemy.hp / enemy.maxHp;
                const color = hpPercent > 0.5 ? '#4caf50' : hpPercent > 0.25 ? '#ff9800' : '#f44336';
                ctx.fillStyle = color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = color + '40';
                ctx.beginPath();
                ctx.roundRect(x, y, barWidth * hpPercent, barHeight, 3);
                ctx.fill();
                
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'white';
                ctx.font = 'bold 11px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(`👑 BOSS ${enemy.hp}/${enemy.maxHp}`, x + barWidth/2, y + barHeight/2);
            }
        }
    }

    function drawFinalScene() {
        ctx.fillStyle = 'rgba(0,0,0,0.75)';
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
        
        // Fondo estrellado
        for (let i = 0; i < 40; i++) {
            const sx = (i * 53 + frameCount * 0.03) % CANVAS_W;
            const sy = (i * 37 + frameCount * 0.02) % (CANVAS_H * 0.6);
            const brightness = 0.3 + Math.sin(frameCount * 0.02 + i * 1.7) * 0.3;
            ctx.fillStyle = `rgba(255,255,255,${brightness})`;
            ctx.beginPath();
            ctx.arc(sx, sy, 1 + Math.random() * 0.5, 0, Math.PI * 2);
            ctx.fill();
        }
        
        ctx.shadowBlur = 40;
        ctx.shadowColor = '#ffd700';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 44px Arial';
        ctx.shadowBlur = 50;
        ctx.fillText('🐕 ¡EL PERRO SALVA A SU DUEÑO! 🐕', CANVAS_W/2, 100);
        
        ctx.shadowBlur = 25;
        ctx.shadowColor = 'rgba(255,200,0,0.4)';
        ctx.fillStyle = 'white';
        ctx.font = '22px Arial';
        ctx.fillText('Después de una épica batalla contra la garrapata gigante...', CANVAS_W/2, 170);
        
        // Escena emotiva
        const perroX = CANVAS_W/2 - 130;
        const perroY = CANVAS_H/2 - 10;
        const duenoX = CANVAS_W/2 + 50;
        const duenoY = CANVAS_H/2 - 30;
        
        // Perro saltando feliz
        const jumpY = Math.sin(frameCount * 0.04) * 15;
        ctx.shadowBlur = 30;
        ctx.shadowColor = 'rgba(255,215,0,0.3)';
        ctx.font = '90px Arial';
        ctx.fillText('🐕', perroX, perroY + jumpY);
        
        // Dueño
        ctx.font = '75px Arial';
        ctx.fillText('🧑', duenoX, duenoY);
        
        // Corazones flotantes
        ctx.shadowBlur = 35;
        ctx.shadowColor = '#ff1744';
        for (let i = 0; i < 7; i++) {
            const hx = CANVAS_W/2 - 170 + i * 60 + Math.sin(frameCount * 0.02 + i * 1.2) * 15;
            const hy = 310 + Math.sin(frameCount * 0.025 + i * 1.8) * 20;
            const size = 24 + Math.sin(frameCount * 0.03 + i) * 6;
            ctx.font = `${size}px Arial`;
            const alpha = 0.5 + Math.sin(frameCount * 0.02 + i) * 0.3;
            ctx.globalAlpha = alpha;
            ctx.fillText('❤️', hx, hy);
        }
        ctx.globalAlpha = 1;
        
        ctx.shadowBlur = 10;
        ctx.shadowColor = 'rgba(255,255,255,0.2)';
        ctx.fillStyle = '#ddd';
        ctx.font = '20px Arial';
        ctx.fillText('"¡Gracias, mi fiel amigo! ¡Te quiero mucho!"', CANVAS_W/2, CANVAS_H - 40);
        
        // Partículas de celebración
        for (let i = 0; i < 15; i++) {
            const px = (i * 67 + frameCount * 0.5) % CANVAS_W;
            const py = (i * 43 + frameCount * 0.3 + 50) % (CANVAS_H * 0.4);
            const colors = ['#ffd700', '#ff1744', '#4caf50', '#2196f3', '#ff6b35'];
            ctx.fillStyle = colors[i % colors.length];
            ctx.globalAlpha = 0.3 + Math.sin(frameCount * 0.03 + i * 0.7) * 0.2;
            ctx.shadowBlur = 15;
            ctx.shadowColor = colors[i % colors.length];
            ctx.beginPath();
            ctx.arc(px, py, 3 + Math.sin(frameCount * 0.04 + i) * 2, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
    }

    // ==================== BUCLE PRINCIPAL ====================
    function gameLoop() {
        frameCount++;
        
        if (!gameState.paused) {
            perro.update(keys);
            
            for (const enemy of enemigos) {
                enemy.update();
            }
            
            for (const item of items) {
                item.update();
            }
            
            updateParticles();
            checkCollisions();
            
            if (perro.y > CANVAS_H + 50) {
                if (gameState.lives > 0) {
                    gameState.lives--;
                    updateUI();
                    perro.x = 50;
                    perro.y = GROUND_Y - 80;
                    perro.vy = 0;
                    perro.vx = 0;
                    spawnParticles(perro.x + perro.width/2, 20, '#ff1744', 15);
                    if (gameState.lives <= 0) {
                        gameOver('💀 Game Over', '¡El perro ha caído al vacío!');
                    }
                }
            }
        }

        ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
        
        if (gameState.finalScene) {
            drawFinalScene();
        } else {
            drawBackground();
            drawPlatforms();
            
            for (const item of items) {
                item.draw(ctx);
            }
            
            for (const enemy of enemigos) {
                enemy.draw(ctx);
            }
            
            perro.draw(ctx);
            drawParticles();
            drawBossHP();
            
            // Info nivel
            const levelNames = ['', '🐛 Nivel 1: Pulgas', '🕷️ Nivel 2: Garrapatas', '⚔️ Nivel 3: Mixto + Boss'];
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.beginPath();
            ctx.roundRect(10, 10, 200, 32, 8);
            ctx.fill();
            ctx.fillStyle = 'white';
            ctx.font = 'bold 14px Arial';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText(levelNames[gameState.level] || '', 18, 16);
            
            // Contador enemigos
            const aliveEnemies = enemigos.filter(e => e.alive).length;
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.beginPath();
            ctx.roundRect(CANVAS_W - 170, 10, 160, 32, 8);
            ctx.fill();
            ctx.fillStyle = '#ff6b6b';
            ctx.fillText(`👾 Enemigos: ${aliveEnemies}`, CANVAS_W - 162, 16);
        }

        requestAnimationFrame(gameLoop);
    }

    // ==================== EVENTOS ====================
    document.addEventListener('keydown', (e) => {
        keys[e.key] = true;
        if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
            e.preventDefault();
        }
        if (e.key === 'Enter' && gameState.showingMessage) {
            msgBtn.click();
        }
    });

    document.addEventListener('keyup', (e) => {
        keys[e.key] = false;
    });

    // Controles móviles
    const mobileKeys = {
        left: false,
        right: false,
        jump: false,
        attack: false
    };

    function setupMobileButton(id, keyOn, keyOff) {
        const btn = document.getElementById(id);
        if (!btn) return;
        btn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (keyOn === 'jump') {
                keys['Space'] = true;
            } else if (keyOn === 'attack') {
                keys['z'] = true;
            } else {
                keys[keyOn] = true;
            }
        });
        btn.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (keyOff === 'jump') {
                keys['Space'] = false;
            } else if (keyOff === 'attack') {
                keys['z'] = false;
            } else {
                keys[keyOff] = false;
            }
        });
        btn.addEventListener('touchcancel', (e) => {
            if (keyOff === 'jump') {
                keys['Space'] = false;
            } else if (keyOff === 'attack') {
                keys['z'] = false;
            } else {
                keys[keyOff] = false;
            }
        });
        // También para mouse (click)
        btn.addEventListener('mousedown', () => {
            if (keyOn === 'jump') keys['Space'] = true;
            else if (keyOn === 'attack') keys['z'] = true;
            else keys[keyOn] = true;
        });
        btn.addEventListener('mouseup', () => {
            if (keyOff === 'jump') keys['Space'] = false;
            else if (keyOff === 'attack') keys['z'] = false;
            else keys[keyOff] = false;
        });
        btn.addEventListener('mouseleave', () => {
            if (keyOff === 'jump') keys['Space'] = false;
            else if (keyOff === 'attack') keys['z'] = false;
            else keys[keyOff] = false;
        });
    }

    setupMobileButton('btnLeft', 'ArrowLeft', 'ArrowLeft');
    setupMobileButton('btnRight', 'ArrowRight', 'ArrowRight');
    setupMobileButton('btnJump', 'jump', 'jump');
    setupMobileButton('btnAttack', 'attack', 'attack');

    resetBtn.addEventListener('click', resetGame);

    // ==================== INICIO ====================
    // RoundRect polyfill para navegadores antiguos
    if (!CanvasRenderingContext2D.prototype.roundRect) {
        CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, radii) {
            const r = typeof radii === 'number' ? radii : (radii || 0);
            this.moveTo(x + r, y);
            this.arcTo(x + w, y, x + w, y + h, r);
            this.arcTo(x + w, y + h, x, y + h, r);
            this.arcTo(x, y + h, x, y, r);
            this.arcTo(x, y, x + w, y, r);
            return this;
        };
    }

    initLevel(1);
    updateUI();
    gameLoop();

    // Prevenir scroll
    window.addEventListener('keydown', (e) => {
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
            e.preventDefault();
        }
    });

    console.log('🐕 ¡Perro Aventurero! - Versión para GitHub Pages');
    console.log('🎮 Controles: ← → Mover | Espacio Saltar | Z Atacar');
    console.log('📱 También funciona en móviles con botones táctiles');
</script>
