<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐕 Perro Aventurero vs Pulgas y Garrapatas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
        }
        #gameWrapper {
            background: linear-gradient(145deg, #1a1a3e, #0d0d2b);
            padding: 15px;
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(233, 69, 96, 0.2);
            border: 2px solid rgba(233, 69, 96, 0.3);
            position: relative;
        }
        #gameContainer {
            position: relative;
            border-radius: 15px;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            max-width: 960px;
            height: auto;
            background: #87CEEB;
            cursor: pointer;
            image-rendering: pixelated;
            touch-action: none;
        }
        #ui {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 18px;
            color: #fff;
            font-size: 15px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 15px 15px 0 0;
            border-bottom: 2px solid rgba(233, 69, 96, 0.3);
            flex-wrap: wrap;
            gap: 8px;
        }
        #ui .stats {
            display: flex;
            gap: 15px;
            align-items: center;
        }
        #ui .stat-item {
            background: rgba(0, 0, 0, 0.4);
            padding: 5px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #ui .stat-item .icon { font-size: 18px; }
        #ui .stat-item .value { 
            color: #ffd700; 
            font-size: 17px;
            min-width: 20px;
        }
        #levelBadge {
            background: linear-gradient(135deg, #ff6b35, #e94560);
            padding: 5px 16px;
            border-radius: 20px;
            font-weight: bold;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.4);
            font-size: 14px;
        }
        #controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 18px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 0 0 15px 15px;
            border-top: 2px solid rgba(233, 69, 96, 0.3);
            flex-wrap: wrap;
            gap: 8px;
        }
        #controls .keys {
            color: #aaa;
            font-size: 12px;
        }
        #controls kbd {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 2px 8px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin: 0 2px;
            font-size: 11px;
        }
        button {
            background: linear-gradient(135deg, #e94560, #c23152);
            border: none;
            color: white;
            padding: 6px 18px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.3);
        }
        button:hover {
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 6px 25px rgba(233, 69, 96, 0.5);
        }
        button:active { transform: scale(0.95); }
        #message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(15px);
            color: white;
            padding: 35px 45px;
            border-radius: 25px;
            text-align: center;
            font-size: 22px;
            border: 3px solid #e94560;
            display: none;
            z-index: 20;
            min-width: 320px;
            max-width: 90%;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9);
        }
        #message h2 {
            font-size: 34px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ffd700, #ff6b35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #message p {
            font-size: 17px;
            margin: 8px 0;
            color: #ddd;
            -webkit-text-fill-color: #ddd;
        }
        #message button {
            margin-top: 18px;
            font-size: 17px;
            padding: 10px 35px;
        }
        #mobileControls {
            display: none;
            gap: 8px;
            justify-content: center;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        #mobileControls button {
            padding: 10px 16px;
            font-size: 18px;
            min-width: 50px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
        }
        #mobileControls button:active {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(0.92);
        }
        .power-up-indicator {
            background: rgba(255, 215, 0, 0.2);
            border: 1px solid #ffd700;
            padding: 2px 12px;
            border-radius: 15px;
            font-size: 13px;
            color: #ffd700;
            display: none;
        }
        @media (max-width: 768px) {
            #gameWrapper { padding: 8px; border-radius: 15px; }
            #ui { font-size: 12px; padding: 6px 10px; }
            #ui .stat-item { padding: 3px 10px; }
            #controls .keys { font-size: 10px; }
            #message { padding: 20px 25px; font-size: 16px; min-width: 250px; }
            #message h2 { font-size: 26px; }
            #mobileControls { display: flex; }
            canvas { touch-action: none; }
        }
        @media (max-width: 480px) {
            #ui .stats { gap: 5px; }
            #ui .stat-item .icon { font-size: 14px; }
            #controls .keys { display: none; }
            #levelBadge { font-size: 11px; padding: 3px 10px; }
        }
    </style>
</head>
<body>

<div id="gameWrapper">
    <div id="gameContainer">
        <div id="ui">
            <div class="stats">
                <div class="stat-item">
                    <span class="icon">❤️</span>
                    <span class="value" id="lives">3</span>
                </div>
                <div class="stat-item">
                    <span class="icon">⭐</span>
                    <span class="value" id="score">0</span>
                </div>
                <div class="stat-item" id="powerUpDisplay" style="display:none;">
                    <span class="icon">🎾</span>
                    <span class="value" id="tennisBalls">0</span>
                </div>
            </div>
            <div id="levelBadge">
                🏆 Nivel <span id="level">1</span>/3
            </div>
            <button id="resetBtn">🔄 Reiniciar</button>
        </div>
        
        <div style="position: relative;">
            <canvas id="gameCanvas" width="960" height="540"></canvas>
            <div id="message">
                <h2 id="msgTitle">🎉 ¡Victoria!</h2>
                <p id="msgBody"></p>
                <button id="msgBtn">Continuar</button>
            </div>
        </div>
        
        <div id="controls">
            <div class="keys">
                <kbd>←</kbd><kbd>→</kbd> Mover &nbsp;|&nbsp; <kbd>Espacio</kbd> Saltar &nbsp;|&nbsp; <kbd>Z</kbd> Ladrar &nbsp;|&nbsp; <kbd>X</kbd> Lanzar pelota
            </div>
            <div style="color: #666; font-size: 11px;">
                🐕 ¡Salva a tu dueño!
            </div>
        </div>
        
        <div id="mobileControls">
            <button id="btnLeft">◀</button>
            <button id="btnRight">▶</button>
            <button id="btnJump">⬆</button>
            <button id="btnBark">🔊</button>
            <button id="btnThrow">🎾</button>
        </div>
    </div>
</div>

<script>
    // ==================== CONFIGURACIÓN ====================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const livesSpan = document.getElementById('lives');
    const scoreSpan = document.getElementById('score');
    const levelSpan = document.getElementById('level');
    const tennisSpan = document.getElementById('tennisBalls');
    const powerUpDisplay = document.getElementById('powerUpDisplay');
    const messageDiv = document.getElementById('message');
    const msgTitle = document.getElementById('msgTitle');
    const msgBody = document.getElementById('msgBody');
    const msgBtn = document.getElementById('msgBtn');
    const resetBtn = document.getElementById('resetBtn');

    const GRAVITY = 0.6;
    const FRICTION = 0.9;
    const MAX_SPEED = 5.5;
    const CANVAS_W = 960;
    const CANVAS_H = 540;
    const GROUND_Y = CANVAS_H - 50;

    // ==================== ESTADO ====================
    let gameState = {
        lives: 3,
        score: 0,
        level: 1,
        maxLevel: 3,
        gameOver: false,
        won: false,
        paused: false,
        showingMessage: false,
        finalScene: false,
        tennisBalls: 0
    };

    // ==================== CLASES ====================
    class Perro {
        constructor(x, y) {
            this.x = x;
            this.y = y;
            this.width = 44;
            this.height = 50;
            this.vx = 0;
            this.vy = 0;
            this.onGround = false;
            this.facing = 1;
            this.barking = false;
            this.barkTimer = 0;
            this.animFrame = 0;
            this.animTimer = 0;
            this.walkCycle = 0;
            this.invincible = 0;
            this.jumpCount = 0;
            this.maxJumps = 2; // Doble salto
        }

        update(keys) {
            // Movimiento
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                this.vx -= 0.8;
                this.facing = -1;
            }
            if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                this.vx += 0.8;
                this.facing = 1;
            }

            if (Math.abs(this.vx) > MAX_SPEED) {
                this.vx = MAX_SPEED * Math.sign(this.vx);
            }

            if (!keys['ArrowLeft'] && !keys['ArrowRight'] && !keys['a'] && !keys['A'] && !keys['d'] && !keys['D']) {
                this.vx *= FRICTION;
                if (Math.abs(this.vx) < 0.1) this.vx = 0;
            }

            // Salto (doble salto)
            if ((keys['Space'] || keys['w'] || keys['W'] || keys['ArrowUp'])) {
                if (this.onGround) {
                    this.vy = -12;
                    this.onGround = false;
                    this.jumpCount = 1;
                } else if (this.jumpCount < this.maxJumps) {
                    this.vy = -11;
                    this.jumpCount++;
                }
            }

            // Ladrar
            if (keys['z'] || keys['Z']) {
                if (!this.barking) {
                    this.barking = true;
                    this.barkTimer = 15;
                }
            }

            // Lanzar pelota (con X)
            if ((keys['x'] || keys['X']) && gameState.tennisBalls > 0 && !gameState.paused) {
                lanzarPelota();
                keys['x'] = false;
                keys['X'] = false;
            }

            this.vy += GRAVITY;
            if (this.vy > 13) this.vy = 13;

            this.x += this.vx;
            this.y += this.vy;

            if (this.x < 0) this.x = 0;
            if (this.x + this.width > CANVAS_W) this.x = CANVAS_W - this.width;
            
            if (this.y + this.height > GROUND_Y) {
                this.y = GROUND_Y - this.height;
                this.vy = 0;
                this.onGround = true;
                this.jumpCount = 0;
            }

            if (this.invincible > 0) this.invincible--;

            if (this.barking) {
                this.barkTimer--;
                if (this.barkTimer <= 0) this.barking = false;
            }

            // Animación
            if (Math.abs(this.vx) > 0.5) {
                this.animTimer++;
                if (this.animTimer > 6) {
                    this.animTimer = 0;
                    this.animFrame = (this.animFrame + 1) % 4;
                    this.walkCycle = (this.walkCycle + 1) % 8;
                }
            } else {
                this.animFrame = 0;
                this.walkCycle = 0;
            }
        }

        draw(ctx) {
            if (this.invincible > 0 && Math.floor(this.invincible / 4) % 2 === 0) {
                ctx.globalAlpha = 0.5;
            }

            const x = this.x;
            const y = this.y;
            const f = this.facing;

            ctx.save();
            ctx.translate(x + this.width/2, y + this.height/2);
            if (f < 0) ctx.scale(-1, 1);
            ctx.translate(-this.width/2, -this.height/2);

            // Sombra
            ctx.shadowColor = 'rgba(0,0,0,0.25)';
            ctx.shadowBlur = 12;
            ctx.shadowOffsetY = 4;

            // Cuerpo
            const grad = ctx.createLinearGradient(0, 0, 0, this.height);
            grad.addColorStop(0, '#deb887');
            grad.addColorStop(0.5, '#c4a35a');
            grad.addColorStop(1, '#8b7355');
            ctx.fillStyle = grad;
            
            ctx.beginPath();
            ctx.ellipse(this.width/2, this.height/2 + 5, 20, 24, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Cabeza
            ctx.shadowBlur = 8;
            ctx.fillStyle = '#deb887';
            ctx.beginPath();
            ctx.ellipse(this.width/2 + 5, 5, 16, 14, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Hocico
            ctx.fillStyle = '#8b7355';
            ctx.beginPath();
            ctx.ellipse(this.width/2 + 14, 8, 9, 7, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Nariz
            ctx.shadowBlur = 4;
            ctx.fillStyle = '#1a1a2e';
            ctx.beginPath();
            ctx.arc(this.width/2 + 18, 7, 4, 0, Math.PI * 2);
            ctx.fill();
            
            // Ojos
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(this.width/2 + 10, 2, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(this.width/2 + 1, 2, 5, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#1a1a2e';
            ctx.beginPath();
            ctx.arc(this.width/2 + 11, 1, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(this.width/2 + 2, 1, 2.5, 0, Math.PI * 2);
            ctx.fill();

            // Brillos
            ctx.fillStyle = 'rgba(255,255,255,0.6)';
            ctx.beginPath();
            ctx.arc(this.width/2 + 12, 0, 1.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(this.width/2 + 3, 0, 1.2, 0, Math.PI * 2);
            ctx.fill();

            // Orejas
            ctx.shadowBlur = 6;
            ctx.fillStyle = '#8b7355';
            ctx.beginPath();
            ctx.ellipse(this.width/2 - 3, -9, 7, 12, -0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(this.width/2 + 14, -9, 7, 12, 0.3, 0, Math.PI * 2);
            ctx.fill();

            // Boca
            ctx.strokeStyle = '#5a3d2b';
            ctx.lineWidth = 1.5;
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(this.width/2 + 14, 11, 7, 0.1, Math.PI - 0.1);
            ctx.stroke();

            // Lengua
            if (this.barking || this.animFrame > 2) {
                ctx.fillStyle = '#ff6b6b';
                ctx.beginPath();
                ctx.arc(this.width/2 + 14, 15, 4, 0, Math.PI);
                ctx.fill();
            }

            // Patas
            ctx.shadowBlur = 6;
            ctx.fillStyle = '#c4a35a';
            const legOffset = this.walkCycle > 3 ? 4 : -4;
            ctx.fillRect(10, this.height - 6 + legOffset, 5, 10);
            ctx.fillRect(24, this.height - 6 - legOffset, 5, 10);
            ctx.fillRect(2, this.height - 6 - legOffset, 5, 10);
            ctx.fillRect(33, this.height - 6 + legOffset, 5, 10);

            // Cola
            ctx.strokeStyle = '#8b7355';
            ctx.lineWidth = 5;
            ctx.lineCap = 'round';
            ctx.shadowBlur = 6;
            ctx.beginPath();
            const tailWag = Math.sin(Date.now() / 160) * 20;
            ctx.moveTo(37, 10);
            ctx.quadraticCurveTo(54, -14 + tailWag, 48, 0 + tailWag);
            ctx.stroke();

            // Collar
            ctx.shadowBlur = 4;
            ctx.strokeStyle = '#e94560';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(this.width/2 + 2, 14, 11, 0.1, Math.PI - 0.1);
            ctx.stroke();
            
            // Placa
            ctx.fillStyle = '#ffd700';
            ctx.shadowBlur = 8;
            ctx.shadowColor = 'rgba(255,215,0,0.4)';
            ctx.beginPath();
            ctx.arc(this.width/2 - 2, 17, 4.5, 0, Math.PI * 2);
            ctx.fill();

            // Efecto de ladrido
            if (this.barking) {
                ctx.shadowBlur = 50;
                ctx.shadowColor = 'rgba(255, 200, 50, 0.5)';
                ctx.strokeStyle = `rgba(255, 200, 50, ${this.barkTimer / 15 * 0.6})`;
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(this.width/2 + 25 * f, 10, 30, -0.7, 0.7);
                ctx.stroke();
                
                ctx.fillStyle = `rgba(255, 215, 0, ${this.barkTimer / 15 * 0.8})`;
                ctx.font = 'bold 24px Arial';
                ctx.shadowBlur = 40;
                ctx.shadowColor = 'rgba(255, 215, 0, 0.5)';
                ctx.fillText('¡GUAU!', this.width/2 + 35 * f, -10);
            }

            ctx.restore();
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
        }

        getBarkBox() {
            return {
                x: this.facing === 1 ? this.x + this.width - 5 : this.x - 60,
                y: this.y - 10,
                width: 70,
                height: this.height + 20
            };
        }
    }

    class Enemigo {
        constructor(x, y, tipo, velocidad = 1) {
            this.x = x;
            this.y = y;
            this.tipo = tipo;
            this.velocidad = velocidad;
            this.direccion = 1;
            this.width = tipo === 'pulga' ? 30 : 40;
            this.height = tipo === 'pulga' ? 24 : 34;
            this.vx = velocidad * this.direccion;
            this.vy = 0;
            this.onGround = false;
            this.animTimer = 0;
            this.animFrame = 0;
            this.patrolRange = 170;
            this.startX = x;
            this.alive = true;
            this.hitTimer = 0;
            this.isBoss = false;
            this.hp = 1;
            this.maxHp = 1;
            this.jumpCooldown = 0;
            this.size = 1;
        }

        update() {
            if (!this.alive) return;
            
            this.x += this.vx;
            
            if (this.x > this.startX + this.patrolRange) {
                this.direccion = -1;
                this.vx = -this.velocidad;
            } else if (this.x < this.startX - this.patrolRange) {
                this.direccion = 1;
                this.vx = this.velocidad;
            }

            if (this.tipo === 'garrapata' && this.jumpCooldown <= 0 && this.onGround && Math.random() < 0.02) {
                this.vy = -8 - Math.random() * 2;
                this.onGround = false;
                this.jumpCooldown = 50;
            }
            if (this.jumpCooldown > 0) this.jumpCooldown--;

            this.vy += GRAVITY;
            if (this.vy > 11) this.vy = 11;
            this.y += this.vy;

            if (this.y + this.height > GROUND_Y) {
                this.y = GROUND_Y - this.height;
                this.vy = 0;
                this.onGround = true;
            }

            this.animTimer++;
            if (this.animTimer > 7) {
                this.animTimer = 0;
                this.animFrame = (this.animFrame + 1) % 4;
            }

            if (this.hitTimer > 0) this.hitTimer--;
        }

        draw(ctx) {
            if (!this.alive) return;
            
            const x = this.x;
            const y = this.y;
            const s = this.size;
            
            ctx.save();
            ctx.shadowColor = 'rgba(0,0,0,0.2)';
            ctx.shadowBlur = 8;
            ctx.shadowOffsetY = 3;

            if (this.tipo === 'pulga') {
                const grad = ctx.createRadialGradient(x+13*s, y+9*s, 2*s, x+15*s, y+11*s, 17*s);
                grad.addColorStop(0, '#6d4c41');
                grad.addColorStop(1, '#2d1b0e');
                ctx.fillStyle = grad;
                
                ctx.beginPath();
                ctx.ellipse(x+14*s, y+11*s, 15*s, 11*s, 0, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.shadowBlur = 8;
                ctx.shadowColor = 'rgba(255,0,0,0.5)';
                ctx.fillStyle = '#ff1744';
                ctx.beginPath();
                ctx.arc(x+8*s, y+7*s, 4*s, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x+20*s, y+7*s, 4*s, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'black';
                ctx.beginPath();
                ctx.arc(x+9*s, y+7*s, 1.8*s, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x+21*s, y+7*s, 1.8*s, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.strokeStyle = '#2d1b0e';
                ctx.lineWidth = 2*s;
                ctx.shadowBlur = 0;
                for (let i = 0; i < 6; i++) {
                    const angle = (i / 6) * Math.PI * 2 + this.animFrame * 0.3;
                    const legX = x + 13*s + Math.cos(angle) * 13*s;
                    const legY = y + 11*s + Math.sin(angle) * 9*s;
                    ctx.beginPath();
                    ctx.moveTo(x + 4*s + i * 4*s, y + 17*s);
                    ctx.lineTo(legX, legY);
                    ctx.stroke();
                }
                
                ctx.strokeStyle = '#2d1b0e';
                ctx.lineWidth = 1.5*s;
                ctx.beginPath();
                ctx.moveTo(x+8*s, y+4*s);
                ctx.lineTo(x+3*s, y-4*s);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x+20*s, y+4*s);
                ctx.lineTo(x+25*s, y-4*s);
                ctx.stroke();
                
            } else {
                const grad = ctx.createRadialGradient(x+20*s, y+14*s, 3*s, x+20*s, y+17*s, 23*s);
                grad.addColorStop(0, '#c62828');
                grad.addColorStop(0.6, '#8e0000');
                grad.addColorStop(1, '#4a0000');
                ctx.fillStyle = grad;
                
                ctx.shadowBlur = 15;
                ctx.shadowColor = 'rgba(139,26,26,0.4)';
                ctx.beginPath();
                ctx.arc(x+20*s, y+17*s, 21*s, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'rgba(255,200,0,0.6)';
                ctx.fillStyle = '#ffd700';
                ctx.beginPath();
                ctx.arc(x+13*s, y+10*s, 5*s, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x+27*s, y+10*s, 5*s, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#1a0000';
                ctx.fillRect(x+12*s, y+8*s, 2.5*s, 6*s);
                ctx.fillRect(x+26*s, y+8*s, 2.5*s, 6*s);
                
                ctx.strokeStyle = 'rgba(0,0,0,0.3)';
                ctx.lineWidth = 1.5*s;
                ctx.beginPath();
                ctx.arc(x+20*s, y+17*s, 11*s, 0, Math.PI * 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x+20*s, y+4*s);
                ctx.lineTo(x+20*s, y+30*s);
                ctx.stroke();
                
                ctx.strokeStyle = '#4a0000';
                ctx.lineWidth = 2.5*s;
                ctx.shadowBlur = 4;
                for (let i = 0; i < 8; i++) {
                    const angle = (i / 8) * Math.PI * 2 + this.animFrame * 0.2;
                    const legX = x + 20*s + Math.cos(angle) * 21*s;
                    const legY = y + 17*s + Math.sin(angle) * 16*s;
                    ctx.beginPath();
                    ctx.moveTo(x + 12*s + i * 2*s, y + 28*s);
                    ctx.lineTo(legX, legY);
                    ctx.stroke();
                }
                
                ctx.fillStyle = '#666';
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.moveTo(x+15*s, y+32*s);
                ctx.lineTo(x+20*s, y+40*s);
                ctx.lineTo(x+25*s, y+32*s);
                ctx.fill();
                
                if (this.hitTimer > 0) {
                    ctx.fillStyle = 'rgba(0,255,0,0.25)';
                    ctx.shadowBlur = 25;
                    ctx.shadowColor = 'rgba(0,255,0,0.4)';
                    for (let i = 0; i < 3; i++) {
                        ctx.beginPath();
                        ctx.arc(x + 8*s + i * 12*s, y + 40*s + i * 4*s, 4*s, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }

                if (this.isBoss) {
                    ctx.shadowBlur = 25;
                    ctx.shadowColor = 'rgba(255,215,0,0.5)';
                    ctx.font = `${35 * s}px Arial`;
                    ctx.textAlign = 'center';
                    ctx.fillText('👑', x + 20*s, y - 8*s);
                    
                    // Tamaño extra para el boss
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = 'rgba(255,0,0,0.3)';
                    ctx.strokeStyle = 'rgba(255,0,0,0.2)';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(x + 20*s, y + 17*s, 25*s, 0, Math.PI * 2);
                    ctx.stroke();
                }
            }
            
            ctx.restore();
            ctx.shadowBlur = 0;
        }

        getBox() {
            const s = this.size;
            return {
                x: this.x + 3 * s,
                y: this.y + 3 * s,
                width: this.width - 6 * s,
                height: this.height - 6 * s
            };
        }
    }

    class Pelota {
        constructor(x, y, dir) {
            this.x = x;
            this.y = y;
            this.vx = 12 * dir;
            this.vy = -3;
            this.width = 16;
            this.height = 16;
            this.alive = true;
            this.life = 120;
            this.gravity = 0.15;
            this.trail = [];
            this.rotation = 0;
        }

        update() {
            if (!this.alive) return;
            
            this.rotation += 0.2;
            this.trail.push({x: this.x, y: this.y});
            if (this.trail.length > 8) this.trail.shift();
            
            this.vy += this.gravity;
            this.x += this.vx;
            this.y += this.vy;
            this.life--;

            // Rebote en el suelo
            if (this.y + this.height > GROUND_Y) {
                this.y = GROUND_Y - this.height;
                this.vy *= -0.4;
                if (Math.abs(this.vy) < 1) this.vy = 0;
            }

            if (this.x < 0 || this.x > CANVAS_W || this.life <= 0) {
                this.alive = false;
            }
        }

        draw(ctx) {
            if (!this.alive) return;
            
            const x = this.x;
            const y = this.y;
            
            // Estela
            for (let i = 0; i < this.trail.length; i++) {
                const alpha = (i / this.trail.length) * 0.3;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = '#ffd700';
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'rgba(255,215,0,0.3)';
                ctx.beginPath();
                ctx.arc(this.trail[i].x + 8, this.trail[i].y + 8, 3 + (i / this.trail.length) * 4, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            
            // Pelota
            ctx.save();
            ctx.translate(x + 8, y + 8);
            ctx.rotate(this.rotation);
            
            ctx.shadowBlur = 25;
            ctx.shadowColor = 'rgba(255,215,0,0.6)';
            
            // Cuerpo de la pelota
            const grad = ctx.createRadialGradient(-3, -3, 2, 0, 0, 10);
            grad.addColorStop(0, '#ffff00');
            grad.addColorStop(0.5, '#ffd700');
            grad.addColorStop(1, '#ff8f00');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(0, 0, 9, 0, Math.PI * 2);
            ctx.fill();
            
            // Líneas de la pelota
            ctx.shadowBlur = 0;
            ctx.strokeStyle = 'rgba(200,150,0,0.3)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(-3, -3, 6, -0.5, 0.5);
            ctx.stroke();
            ctx.beginPath();
            ctx.arc(3, 3, 6, Math.PI - 0.5, Math.PI + 0.5);
            ctx.stroke();
            
            // Brillo
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(-3, -4, 3, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();
            ctx.shadowBlur = 0;
        }

        getBox() {
            return {
                x: this.x + 2,
                y: this.y + 2,
                width: this.width - 4,
                height: this.height - 4
            };
        }
    }

    class Item {
        constructor(x, y, tipo) {
            this.x = x;
            this.y = y;
            this.tipo = tipo;
            this.width = 26;
            this.height = 26;
            this.alive = true;
            this.animTimer = 0;
            this.vy = -2;
            this.gravity = 0.1;
            this.glowIntensity = 0;
        }

        update() {
            if (!this.alive) return;
            this.animTimer++;
            this.glowIntensity = Math.sin(this.animTimer / 10) * 0.3 + 0.7;
            this.vy += this.gravity;
            this.y += this.vy;
            
            if (this.y + this.height > GROUND_Y) {
                this.y = GROUND_Y - this.height;
                this.vy = 0;
            }
        }

        draw(ctx) {
            if (!this.alive) return;
            
            ctx.save();
            const pulse = Math.sin(this.animTimer / 8) * 3;
            const glow = this.glowIntensity;
            
            ctx.shadowBlur = 25;
            
            if (this.tipo === 'hueso') {
                ctx.shadowColor = `rgba(255,215,0,${glow * 0.3})`;
                ctx.fillStyle = '#f5e6d3';
                ctx.strokeStyle = '#d4b896';
                ctx.lineWidth = 2;
                
                ctx.beginPath();
                ctx.ellipse(this.x+7, this.y+11+pulse, 5.5, 7.5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.beginPath();
                ctx.ellipse(this.x+19, this.y+11+pulse, 5.5, 7.5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.fillRect(this.x+5, this.y+5+pulse, 16, 11);
                ctx.strokeRect(this.x+5, this.y+5+pulse, 16, 11);
                
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.beginPath();
                ctx.arc(this.x+10, this.y+7+pulse, 3, 0, Math.PI * 2);
                ctx.fill();
                
            } else if (this.tipo === 'corazon') {
                ctx.shadowColor = `rgba(255,0,0,${glow * 0.5})`;
                ctx.fillStyle = '#ff1744';
                ctx.beginPath();
                ctx.moveTo(this.x+13, this.y+6+pulse);
                ctx.bezierCurveTo(this.x+13, this.y-3+pulse, this.x+2, this.y-3+pulse, this.x+2, this.y+6+pulse);
                ctx.bezierCurveTo(this.x+2, this.y+16+pulse, this.x+13, this.y+24+pulse, this.x+13, this.y+24+pulse);
                ctx.bezierCurveTo(this.x+13, this.y+24+pulse, this.x+24, this.y+16+pulse, this.x+24, this.y+6+pulse);
                ctx.bezierCurveTo(this.x+24, this.y-3+pulse, this.x+13, this.y-3+pulse, this.x+13, this.y+6+pulse);
                ctx.fill();
                
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.beginPath();
                ctx.arc(this.x+9, this.y+7+pulse, 3, 0, Math.PI * 2);
                ctx.fill();
                
            } else if (this.tipo === 'pelota') {
                // Item de pelota de tenis
                ctx.shadowColor = `rgba(255,215,0,${glow * 0.5})`;
                
                const grad = ctx.createRadialGradient(
                    this.x+8, this.y+8, 3,
                    this.x+13, this.y+13, 14
                );
                grad.addColorStop(0, '#ffff00');
                grad.addColorStop(0.5, '#ffd700');
                grad.addColorStop(1, '#ff8f00');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(this.x+13, this.y+13+pulse, 13, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(200,150,0,0.3)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(this.x+10, this.y+10+pulse, 8, -0.5, 0.5);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(this.x+16, this.y+16+pulse, 8, Math.PI - 0.5, Math.PI + 0.5);
                ctx.stroke();
                
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.arc(this.x+9, this.y+9+pulse, 3, 0, Math.PI * 2);
                ctx.fill();
            }
            
            ctx.restore();
            ctx.shadowBlur = 0;
        }

        getBox() {
            return {
                x: this.x + 3,
                y: this.y + 3,
                width: this.width - 6,
                height: this.height - 6
            };
        }
    }

    // ==================== VARIABLES GLOBALES ====================
    let perro;
    let enemigos = [];
    let items = [];
    let pelotas = [];
    let keys = {};
    let particles = [];
    let frameCount = 0;
    let bossDefeated = false;
    let finalSceneTimer = 0;
    let platforms = [];
    let canThrow = false;
    let showingFinalScene = false;

    // ==================== FUNCIONES ====================
    function initLevel(level) {
        perro = new Perro(50, GROUND_Y - 80);
        enemigos = [];
        items = [];
        pelotas = [];
        particles = [];
        bossDefeated = false;
        finalSceneTimer = 0;
        gameState.finalScene = false;
        showingFinalScene = false;
        gameState.tennisBalls = 0;
        canThrow = false;
        powerUpDisplay.style.display = 'none';
        updateUI();
        
        messageDiv.style.display = 'none';
        gameState.showingMessage = false;
        
        const numEnemies = 4 + level * 2;
        
        if (level === 1) {
            for (let i = 0; i < numEnemies; i++) {
                const x = 140 + i * 120 + Math.random() * 40;
                enemigos.push(new Enemigo(x, GROUND_Y - 30, 'pulga', 0.9 + Math.random() * 0.5));
            }
            for (let i = 0; i < 3; i++) {
                items.push(new Item(180 + i * 200, 100, 'hueso'));
            }
            items.push(new Item(750, 80, 'corazon'));
            items.push(new Item(400, 50, 'pelota')); // Item de pelota
            
        } else if (level === 2) {
            for (let i = 0; i < numEnemies - 1; i++) {
                const x = 100 + i * 140 + Math.random() * 50;
                enemigos.push(new Enemigo(x, GROUND_Y - 30, 'garrapata', 0.7 + Math.random() * 0.4));
            }
            for (let i = 0; i < 4; i++) {
                items.push(new Item(130 + i * 160, 90 + i * 15, 'hueso'));
            }
            items.push(new Item(700, 60, 'corazon'));
            items.push(new Item(450, 40, 'pelota'));
            
        } else if (level === 3) {
            for (let i = 0; i < 4; i++) {
                const x = 70 + i * 150 + Math.random() * 40;
                enemigos.push(new Enemigo(x, GROUND_Y - 30, 'pulga', 1.0 + Math.random() * 0.4));
            }
            for (let i = 0; i < 4; i++) {
                const x = 90 + i * 160 + Math.random() * 50;
                enemigos.push(new Enemigo(x, GROUND_Y - 30, 'garrapata', 0.8 + Math.random() * 0.3));
            }
            for (let i = 0; i < 5; i++) {
                items.push(new Item(90 + i * 150, 70 + i * 18, 'hueso'));
            }
            items.push(new Item(760, 50, 'corazon'));
            items.push(new Item(500, 30, 'pelota'));
            
            // BOSS - Garrapata Gigante (tamaño 2x)
            const boss = new Enemigo(820, GROUND_Y - 60, 'garrapata', 1.8);
            boss.width = 80;
            boss.height = 70;
            boss.size = 2.0;
            boss.patrolRange = 50;
            boss.startX = 820;
            boss.velocidad = 1.8;
            boss.isBoss = true;
            boss.hp = 8;
            boss.maxHp = 8;
            enemigos.push(boss);
        }

        // Plataformas
        platforms = [];
        for (let i = 0; i < 6; i++) {
            platforms.push({
                x: 50 + i * 160,
                y: GROUND_Y - 70 - Math.sin(i * 0.7) * 30,
                width: 80,
                height: 14
            });
        }
        platforms.push({ x: 350, y: GROUND_Y - 145, width: 110, height: 14 });
        platforms.push({ x: 550, y: GROUND_Y - 185, width: 100, height: 14 });
        platforms.push({ x: 730, y: GROUND_Y - 130, width: 90, height: 14 });
    }

    function lanzarPelota() {
        if (gameState.tennisBalls <= 0 || gameState.paused) return;
        
        const dir = perro.facing;
        const pelota = new Pelota(
            perro.x + perro.width/2 + (dir > 0 ? 20 : -20),
            perro.y + 10,
            dir
        );
        pelotas.push(pelota);
        gameState.tennisBalls--;
        updateUI();
        
        // Partículas de lanzamiento
        spawnParticles(pelota.x, pelota.y, '#ffd700', 8);
        
        if (gameState.tennisBalls <= 0) {
            powerUpDisplay.style.display = 'none';
        }
    }

    function spawnParticles(x, y, color, count) {
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = 2 + Math.random() * 4;
            particles.push({
                x: x,
                y: y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - 2,
                life: 25 + Math.random() * 25,
                color: color,
                size: 2 + Math.random() * 5
            });
        }
    }

    function rectCollide(r1, r2) {
        return r1.x < r2.x + r2.width &&
               r1.x + r1.width > r2.x &&
               r1.y < r2.y + r2.height &&
               r1.y + r1.height > r2.y;
    }

    function checkCollisions() {
        // Plataformas
        perro.onGround = false;
        for (const plat of platforms) {
            if (perro.vy >= 0 &&
                perro.x + perro.width - 5 > plat.x &&
                perro.x + 5 < plat.x + plat.width &&
                perro.y + perro.height > plat.y &&
                perro.y + perro.height < plat.y + plat.height + 12) {
                perro.y = plat.y - perro.height;
                perro.vy = 0;
                perro.onGround = true;
                perro.jumpCount = 0;
            }
        }

        // Colisiones con enemigos - al pisarlos
        for (const enemy of enemigos) {
            if (!enemy.alive) continue;
            
            const enemyBox = enemy.getBox();
            const perroBox = {
                x: perro.x + 8,
                y: perro.y + 8,
                width: perro.width - 16,
                height: perro.height - 16
            };
            
            // Pisar enemigo (desde arriba)
            if (rectCollide(perroBox, enemyBox) && perro.vy > 0 && perro.invincible === 0) {
                // El perro está cayendo sobre el enemigo
                if (!enemy.isBoss) {
                    enemy.alive = false;
                    gameState.score += 15;
                    perro.vy = -8;
                    spawnParticles(enemy.x + enemy.width/2, enemy.y + enemy.height/2, '#ff6b35', 15);
                    updateUI();
                } else {
                    // Boss - solo se daña con pelotas
                    perro.vy = -6;
                }
                continue;
            }
            
            // Colisión normal con enemigo
            if (rectCollide(perroBox, enemyBox) && perro.invincible === 0) {
                // Verificar si está ladrando
                if (perro.barking) {
                    const barkBox = perro.getBarkBox();
                    if (rectCollide(barkBox, enemyBox)) {
                        if (enemy.isBoss) {
                            enemy.hp--;
                            enemy.hitTimer = 10;
                            spawnParticles(enemy.x + enemy.width/2, enemy.y + enemy.height/2, '#ff6b35', 20);
                            if (enemy.hp <= 0) {
                                enemy.alive = false;
                                bossDefeated = true;
                                gameState.score += 100;
                                spawnParticles(enemy.x + enemy.width/2, enemy.y + enemy.height/2, '#ffd700', 50);
                                updateUI();
                            }
                        } else {
                            enemy.alive = false;
                            gameState.score += 10;
                            spawnParticles(enemy.x + enemy.width/2, enemy.y + enemy.height/2, '#ff6b35', 15);
                            updateUI();
                        }
                        continue;
                    }
                }
                
                // Recibir daño
                gameState.lives--;
                perro.invincible = 60;
                spawnParticles(perro.x + perro.width/2, perro.y + perro.height/2, '#ff1744', 25);
                updateUI();
                
                if (gameState.lives <= 0) {
                    gameOver('💀 Game Over', '¡El perro ha sido derrotado!');
                }
            }
        }

        // Colisiones con pelotas
        for (let i = pelotas.length - 1; i >= 0; i--) {
            const pelota = pelotas[i];
            if (!pelota.alive) continue;
            
            const pelotaBox = pelota.getBox();
            let hitEnemy = false;
            
            for (const enemy of enemigos) {
                if (!enemy.alive) continue;
                const enemyBox = enemy.getBox();
                
                if (rectCollide(pelotaBox, enemyBox)) {
                    // La pelota golpea al enemigo
                    if (enemy.isBoss) {
                        enemy.hp--;
                        enemy.hitTimer = 10;
                        spawnParticles(pelota.x + pelota.width/2, pelota.y + pelota.height/2, '#ff6b35', 20);
                        if (enemy.hp <= 0) {
                            enemy.alive = false;
                            bossDefeated = true;
                            gameState.score += 100;
                            spawnParticles(enemy.x + enemy.width/2, enemy.y + enemy.height/2, '#ffd700', 50);
                            updateUI();
                        }
                    } else {
                        enemy.alive = false;
                        gameState.score += 10;
                        spawnParticles(pelota.x + pelota.width/2, pelota.y + pelota.height/2, '#ff6b35', 15);
                        updateUI();
                    }
                    pelota.alive = false;
                    hitEnemy = true;
                    break;
                }
            }
            
            // La pelota rebota en el suelo y paredes
            if (pelota.y + pelota.height > GROUND_Y) {
                pelota.vy *= -0.5;
                pelota.y = GROUND_Y - pelota.height;
            }
        }

        // Items
        for (const item of items) {
            if (!item.alive) continue;
            const itemBox = item.getBox();
            const perroBox = {
                x: perro.x + 6,
                y: perro.y + 6,
                width: perro.width - 12,
                height: perro.height - 12
            };
            
            if (rectCollide(perroBox, itemBox)) {
                item.alive = false;
                if (item.tipo === 'hueso') {
                    gameState.score += 5;
                    spawnParticles(item.x + item.width/2, item.y + item.height/2, '#ffd700', 12);
                } else if (item.tipo === 'corazon') {
                    gameState.lives = Math.min(gameState.lives + 1, 5);
                    spawnParticles(item.x + item.width/2, item.y + item.height/2, '#ff1744', 20);
                } else if (item.tipo === 'pelota') {
                    gameState.tennisBalls += 3;
                    powerUpDisplay.style.display = 'flex';
                    spawnParticles(item.x + item.width/2, item.y + item.height/2, '#ffd700', 25);
                }
                updateUI();
            }
        }

        // Verificar si todos los enemigos están muertos
        let allDead = true;
        for (const enemy of enemigos) {
            if (enemy.alive) {
                allDead = false;
                break;
            }
        }

        if (allDead && !gameState.gameOver && !gameState.showingMessage) {
            if (gameState.level === gameState.maxLevel && bossDefeated) {
                // Escena final
                gameState.finalScene = true;
                gameState.paused = true;
                showingFinalScene = true;
                setTimeout(() => {
                    showMessage('🏆 ¡Misión Cumplida!', 
                        '🐕 El perro rescató a su dueño de la garrapata gigante.\n¡Eres un héroe!', 
                        '🔄 Jugar de nuevo');
                    msgBtn.onclick = resetGame;
                }, 2000);
            } else if (gameState.level < gameState.maxLevel) {
                showMessage('🎉 ¡Nivel Completado!', `Puntaje: ${gameState.score}`, '⬆ Siguiente Nivel');
                msgBtn.onclick = () => {
                    gameState.level++;
                    updateUI();
                    initLevel(gameState.level);
                    messageDiv.style.display = 'none';
                    gameState.showingMessage = false;
                    gameState.paused = false;
                };
            }
        }
    }

    // ==================== UI ====================
    function updateUI() {
        livesSpan.textContent = gameState.lives;
        scoreSpan.textContent = gameState.score;
        levelSpan.textContent = gameState.level;
        tennisSpan.textContent = gameState.tennisBalls;
        if (gameState.tennisBalls > 0) {
            powerUpDisplay.style.display = 'flex';
        } else {
            powerUpDisplay.style.display = 'none';
        }
    }

    function showMessage(title, body, btnText) {
        messageDiv.style.display = 'block';
        msgTitle.textContent = title;
        msgBody.textContent = body;
        msgBtn.textContent = btnText || 'Continuar';
        gameState.showingMessage = true;
        gameState.paused = true;
    }

    function gameOver(title, body) {
        gameState.gameOver = true;
        showMessage(title, body, '🔄 Reintentar');
        msgBtn.onclick = resetGame;
    }

    function resetGame() {
        gameState.lives = 3;
        gameState.score = 0;
        gameState.level = 1;
        gameState.gameOver = false;
        gameState.showingMessage = false;
        gameState.paused = false;
        gameState.finalScene = false;
        showingFinalScene = false;
        gameState.tennisBalls = 0;
        powerUpDisplay.style.display = 'none';
        messageDiv.style.display = 'none';
        bossDefeated = false;
        pelotas = [];
        updateUI();
        initLevel(gameState.level);
    }

    // ==================== DIBUJADO ====================
    function drawBackground() {
        const skyGrad = ctx.createLinearGradient(0, 0, 0, CANVAS_H);
        skyGrad.addColorStop(0, '#0d1b2a');
        skyGrad.addColorStop(0.2, '#1b3a4b');
        skyGrad.addColorStop(0.5, '#4a90a8');
        skyGrad.addColorStop(0.8, '#87CEEB');
        skyGrad.addColorStop(1, '#b5dffa');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
        
        // Sol
        const sunX = CANVAS_W - 80;
        const sunY = 55;
        const sunGrad = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 85);
        sunGrad.addColorStop(0, 'rgba(255,235,59,1)');
        sunGrad.addColorStop(0.3, 'rgba(255,235,59,0.8)');
        sunGrad.addColorStop(1, 'rgba(255,235,59,0)');
        ctx.fillStyle = sunGrad;
        ctx.beginPath();
        ctx.arc(sunX, sunY, 85, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = '#fff9c4';
        ctx.shadowBlur = 45;
        ctx.shadowColor = 'rgba(255,235,59,0.4)';
        ctx.beginPath();
        ctx.arc(sunX, sunY, 38, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        
        // Nubes
        ctx.fillStyle = 'rgba(255,255,255,0.2)';
        const cloudOffset = frameCount * 0.015 % CANVAS_W;
        for (let i = 0; i < 6; i++) {
            const cx = (i * 180 + cloudOffset) % CANVAS_W;
            const cy = 25 + i * 20 % 50;
            ctx.beginPath();
            ctx.arc(cx, cy, 30, 0, Math.PI * 2);
            ctx.arc(cx + 38, cy - 8, 34, 0, Math.PI * 2);
            ctx.arc(cx + 76, cy, 30, 0, Math.PI * 2);
            ctx.fill();
        }
        
        // Montañas
        ctx.fillStyle = '#1a3a2a';
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y);
        for (let x = 0; x <= CANVAS_W; x += 15) {
            const y = GROUND_Y - Math.sin(x * 0.007 + 0.5) * 50 - Math.sin(x * 0.012 + 2) * 28 - 20;
            ctx.lineTo(x, y);
        }
        ctx.lineTo(CANVAS_W, GROUND_Y);
        ctx.fill();
        
        ctx.fillStyle = '#2a5a3a';
        ctx.beginPath();
        ctx.moveTo(0, GROUND_Y);
        for (let x = 0; x <= CANVAS_W; x += 15) {
            const y = GROUND_Y - Math.sin(x * 0.005 + 1.5) * 32 - Math.sin(x * 0.009 + 0.5) * 22 - 10;
            ctx.lineTo(x, y);
        }
        ctx.lineTo(CANVAS_W, GROUND_Y);
        ctx.fill();
        
        // Césped
        ctx.fillStyle = '#4caf50';
        ctx.fillRect(0, GROUND_Y, CANVAS_W, 50);
        ctx.fillStyle = '#388e3c';
        for (let x = 0; x < CANVAS_W; x += 5) {
            const h = 4 + Math.sin(x * 0.4 + frameCount * 0.02) * 2;
            ctx.fillRect(x, GROUND_Y - h, 2, h);
        }
        
        // Camino
        ctx.fillStyle = 'rgba(139, 115, 85, 0.25)';
        ctx.fillRect(0, GROUND_Y + 2, CANVAS_W, 8);
    }

    function drawPlatforms() {
        for (const plat of platforms) {
            const grad = ctx.createLinearGradient(plat.x, plat.y, plat.x, plat.y + plat.height);
            grad.addColorStop(0, '#a1887f');
            grad.addColorStop(0.5, '#795548');
            grad.addColorStop(1, '#4e342e');
            ctx.fillStyle = grad;
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = 10;
            ctx.shadowOffsetY = 3;
            
            ctx.beginPath();
            ctx.roundRect(plat.x, plat.y, plat.width, plat.height, 6);
            ctx.fill();
            
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255,255,255,0.12)';
            ctx.fillRect(plat.x + 6, plat.y, plat.width - 12, 3);
            
            ctx.fillStyle = '#66bb6a';
            for (let x = plat.x + 5; x < plat.x + plat.width - 5; x += 12) {
                ctx.fillRect(x, plat.y - 3, 2, 4);
            }
        }
    }

    function drawParticles() {
        for (const p of particles) {
            ctx.globalAlpha = Math.min(1, p.life / 25);
            ctx.fillStyle = p.color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * (0.3 + 0.7 * p.life / 50), 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
    }

    function updateParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.1;
            p.vx *= 0.98;
            p.life--;
            if (p.life <= 0) particles.splice(i, 1);
        }
    }

    function drawBossHP() {
        for (const enemy of enemigos) {
            if (enemy.isBoss && enemy.alive) {
                const barWidth = 150;
                const barHeight = 16;
                const x = enemy.x + enemy.width/2 - barWidth/2;
                const y = enemy.y - 38;
                
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                ctx.beginPath();
                ctx.roundRect(x - 3, y - 3, barWidth + 6, barHeight + 6, 5);
                ctx.fill();
                
                ctx.fillStyle = '#2a2a2a';
                ctx.beginPath();
                ctx.roundRect(x, y, barWidth, barHeight, 4);
                ctx.fill();
                
                const hpPercent = enemy.hp / enemy.maxHp;
                const color = hpPercent > 0.5 ? '#4caf50' : hpPercent > 0.25 ? '#ff9800' : '#f44336';
                ctx.fillStyle = color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = color + '50';
                ctx.beginPath();
                ctx.roundRect(x, y, barWidth * hpPercent, barHeight, 4);
                ctx.fill();
                
                ctx.shadowBlur = 0;
                ctx.fillStyle = 'white';
                ctx.font = 'bold 12px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(`👑 GARRAPATA GIGANTE ${enemy.hp}/${enemy.maxHp}`, x + barWidth/2, y + barHeight/2);
                
                // Aura de boss
                ctx.shadowBlur = 30;
                ctx.shadowColor = 'rgba(255,0,0,0.2)';
                ctx.strokeStyle = `rgba(255,0,0,${0.1 + Math.sin(frameCount * 0.03) * 0.05})`;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(enemy.x + enemy.width/2, enemy.y + enemy.height/2, 55, 0, Math.PI * 2);
                ctx.stroke();
            }
        }
    }

    function drawFinalScene() {
        ctx.fillStyle = 'rgba(0,0,0,0.78)';
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
        
        // Estrellas
        for (let i = 0; i < 50; i++) {
            const sx = (i * 53 + frameCount * 0.02) % CANVAS_W;
            const sy = (i * 37 + frameCount * 0.015) % (CANVAS_H * 0.6);
            const brightness = 0.3 + Math.sin(frameCount * 0.02 + i * 1.7) * 0.3;
            ctx.fillStyle = `rgba(255,255,255,${brightness})`;
            ctx.beginPath();
            ctx.arc(sx, sy, 1 + Math.random() * 0.5, 0, Math.PI * 2);
            ctx.fill();
        }
        
        ctx.shadowBlur = 45;
        ctx.shadowColor = '#ffd700';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        ctx.fillStyle = '#ffd700';
        ctx.font = 'bold 42px Arial';
        ctx.shadowBlur = 55;
        ctx.fillText('🐕 ¡EL PERRO RESCATA A SU DUEÑO! 🐕', CANVAS_W/2, 90);
        
        ctx.shadowBlur = 25;
        ctx.shadowColor = 'rgba(255,200,0,0.4)';
        ctx.fillStyle = 'white';
        ctx.font = '20px Arial';
        ctx.fillText('¡Después de una épica batalla contra la garrapata gigante!', CANVAS_W/2, 150);
        
        // Escena emotiva
        const perroX = CANVAS_W/2 - 160;
        const perroY = CANVAS_H/2 - 20;
        const duenoX = CANVAS_W/2 + 60;
        const duenoY = CANVAS_H/2 - 40;
        
        // Perro saltando feliz
        const jumpY = Math.sin(frameCount * 0.04) * 18;
        ctx.shadowBlur = 35;
        ctx.shadowColor = 'rgba(255,215,0,0.3)';
        ctx.font = '100px Arial';
        ctx.fillText('🐕', perroX, perroY + jumpY);
        
        // Dueño
        ctx.font = '85px Arial';
        ctx.fillText('🧑', duenoX, duenoY);
        
        // Corazones flotantes
        ctx.shadowBlur = 40;
        ctx.shadowColor = '#ff1744';
        for (let i = 0; i < 8; i++) {
            const hx = CANVAS_W/2 - 200 + i * 60 + Math.sin(frameCount * 0.02 + i * 1.2) * 18;
            const hy = 300 + Math.sin(frameCount * 0.025 + i * 1.8) * 25;
            const size = 26 + Math.sin(frameCount * 0.03 + i) * 8;
            ctx.font = `${size}px Arial`;
            const alpha = 0.5 + Math.sin(frameCount * 0.02 + i) * 0.3;
            ctx.globalAlpha = alpha;
            ctx.fillText('❤️', hx, hy);
        }
        ctx.globalAlpha = 1;
        
        ctx.shadowBlur = 12;
        ctx.shadowColor = 'rgba(255,255,255,0.2)';
        ctx.fillStyle = '#ddd';
        ctx.font = '22px Arial';
        ctx.fillText('"¡Gracias, mi fiel amigo! ¡Te quiero mucho!"', CANVAS_W/2, CANVAS_H - 50);
        
        // Partículas de celebración
        for (let i = 0; i < 20; i++) {
            const px = (i * 67 + frameCount * 0.4) % CANVAS_W;
            const py = (i * 43 + frameCount * 0.25 + 50) % (CANVAS_H * 0.45);
            const colors = ['#ffd700', '#ff1744', '#4caf50', '#2196f3', '#ff6b35', '#9c27b0'];
            ctx.fillStyle = colors[i % colors.length];
            ctx.globalAlpha = 0.3 + Math.sin(frameCount * 0.03 + i * 0.7) * 0.2;
            ctx.shadowBlur = 20;
            ctx.shadowColor = colors[i % colors.length];
            ctx.beginPath();
            ctx.arc(px, py, 4 + Math.sin(frameCount * 0.04 + i) * 2.5, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
    }

    // ==================== BUCLE PRINCIPAL ====================
    function gameLoop() {
        frameCount++;
        
        if (!gameState.paused) {
            perro.update(keys);
            
            for (const enemy of enemigos) {
                enemy.update();
            }
            
            for (const item of items) {
                item.update();
            }
            
            for (const pelota of pelotas) {
                pelota.update();
            }
            
            updateParticles();
            checkCollisions();
            
            if (perro.y > CANVAS_H + 50) {
                if (gameState.lives > 0) {
                    gameState.lives--;
                    updateUI();
                    perro.x = 50;
                    perro.y = GROUND_Y - 80;
                    perro.vy = 0;
                    perro.vx = 0;
                    spawnParticles(perro.x + perro.width/2, 20, '#ff1744', 15);
                    if (gameState.lives <= 0) {
                        gameOver('💀 Game Over', '¡El perro ha caído al vacío!');
                    }
                }
            }
            
            // Limpiar pelotas muertas
            pelotas = pelotas.filter(p => p.alive);
        }

        ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
        
        if (gameState.finalScene && showingFinalScene) {
            drawFinalScene();
        } else {
            drawBackground();
            drawPlatforms();
            
            for (const item of items) {
                item.draw(ctx);
            }
            
            for (const enemy of enemigos) {
                enemy.draw(ctx);
            }
            
            for (const pelota of pelotas) {
                pelota.draw(ctx);
            }
            
            perro.draw(ctx);
            drawParticles();
            drawBossHP();
            
            // Info nivel
            const levelNames = ['', '🐛 Pulgas', '🕷️ Garrapatas', '⚔️ Mixto + Boss'];
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.beginPath();
            ctx.roundRect(10, 10, 210, 32, 8);
            ctx.fill();
            ctx.fillStyle = 'white';
            ctx.font = 'bold 13px Arial';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText(levelNames[gameState.level] || '', 18, 16);
            
            // Contador enemigos
            const aliveEnemies = enemigos.filter(e => e.alive).length;
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.beginPath();
            ctx.roundRect(CANVAS_W - 170, 10, 160, 32, 8);
            ctx.fill();
            ctx.fillStyle = '#ff6b6b';
            ctx.fillText(`👾 Enemigos: ${aliveEnemies}`, CANVAS_W - 162, 16);
            
            // Indicador de pelotas
            if (gameState.tennisBalls > 0) {
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.beginPath();
                ctx.roundRect(CANVAS_W/2 - 60, 10, 120, 32, 8);
                ctx.fill();
                ctx.fillStyle = '#ffd700';
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(`🎾 x${gameState.tennisBalls}`, CANVAS_W/2, 16);
            }
        }

        requestAnimationFrame(gameLoop);
    }

    // ==================== EVENTOS ====================
    document.addEventListener('keydown', (e) => {
        keys[e.key] = true;
        if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
            e.preventDefault();
        }
        if (e.key === 'Enter' && gameState.showingMessage) {
            msgBtn.click();
        }
        if ((e.key === 'x' || e.key === 'X') && gameState.tennisBalls > 0 && !gameState.paused) {
            lanzarPelota();
        }
    });

    document.addEventListener('keyup', (e) => {
        keys[e.key] = false;
    });

    // Controles móviles
    function setupMobileButton(id, keyOn, keyOff, isAction = false) {
        const btn = document.getElementById(id);
        if (!btn) return;
        
        const press = (e) => {
            e.preventDefault();
            if (isAction) {
                if (keyOn === 'throw') {
                    lanzarPelota();
                } else {
                    keys[keyOn] = true;
                }
            } else {
                keys[keyOn] = true;
            }
        };
        
        const release = (e) => {
            e.preventDefault();
            if (!isAction) {
                keys[keyOff] = false;
            }
        };
        
        btn.addEventListener('touchstart', press);
        btn.addEventListener('touchend', release);
        btn.addEventListener('touchcancel', release);
        btn.addEventListener('mousedown', press);
        btn.addEventListener('mouseup', release);
        btn.addEventListener('mouseleave', release);
    }

    setupMobileButton('btnLeft', 'ArrowLeft', 'ArrowLeft');
    setupMobileButton('btnRight', 'ArrowRight', 'ArrowRight');
    setupMobileButton('btnJump', 'Space', 'Space');
    setupMobileButton('btnBark', 'z', 'z');
    setupMobileButton('btnThrow', 'throw', 'throw', true);

    resetBtn.addEventListener('click', resetGame);

    // ==================== INICIO ====================
    if (!CanvasRenderingContext2D.prototype.roundRect) {
        CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, radii) {
            const r = typeof radii === 'number' ? radii : (radii || 0);
            this.moveTo(x + r, y);
            this.arcTo(x + w, y, x + w, y + h, r);
            this.arcTo(x + w, y + h, x, y + h, r);
            this.arcTo(x, y + h, x, y, r);
            this.arcTo(x, y, x + w, y, r);
            return this;
        };
    }

    initLevel(1);
    updateUI();
    gameLoop();

    window.addEventListener('keydown', (e) => {
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
            e.preventDefault();
        }
    });

    console.log('🐕 ¡Perro Aventurero! - Versión Mejorada');
    console.log('🎮 Controles:');
    console.log('  ← → Mover | Espacio Saltar (doble salto)');
    console.log('  Z Ladrar (derrota enemigos cercanos)');
    console.log('  X Lanzar pelota (necesitas tener pelotas)');
    console.log('🎾 Recolecta pelotas para lanzarlas a los enemigos');
    console.log('👑 El boss solo se derrota con pelotas o ladridos');
</script>
